<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_transform_uppercase{
            text-transform: uppercase;
        }
        .t_transform_lowercase{
            text-transform: lowercase;
        }
        .t_transform_capitilize{
            text-transform: capitalize;
        }
        .t_decor_underline{
            text-decoration: underline;
        }
        .t_decor_overline{
            text-decoration: overline;
        }
        .t_decor_line-through{
            text-decoration: line-through;
        }
        .t_decor_all{
            text-decoration: underline overline line-through;
        }
        .t_align_r{
            text-align: right;
        }   
        .t_align_l{
            text-align: left;
        }
        .t_align_c{
            text-align: center;
        }
        .t_shadow{
            color: blue;
            font-size: 90px;
            text-shadow: 8px 9px 6px grey;
        }
    </style>

</head>
<body>
    <h1 class="t_shadow t_align_c">Anand</h1>
    <h1 class="t_align_c">Hello Yogesh</h1>
    <h1 class="t_align_l">Hello Yogesh</h1>
    <h1 class="t_align_r">Hello Yogesh</h1>
    <h1 class="t_decor_all">Anand</h1>
    <h1 class="t_decor_underline">Hello Welcome Ayush</h1>
    <h1 class="t_decor_overline">Hello Welcome Ayush</h1>
    <h1 class="t_decor_line-through">Hello Welcome Ayush</h1>

    <h1 class="t_transform_uppercase">This is Example of rText formatting</h1>
    <h1 class="t_transform_lowercase">This is Example of rText formatting</h1>
    <h1 class="t_transform_capitilize">This is Example of rText formatting</h1>

</body>
</html>
