<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-container{
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
            /* space-evenly, space- between, space-around  */
            justify-content: center;
            list-style: none;
        }

        .flex-item{
            background-color: blueviolet;
            padding: 10px;
            margin: 10px;
            width: 200px;
            height: 150px;
            margin-top: 10px;
            color: white;
            font-size: 50px;
            border: 3px solid red;
            border-radius: 20px;
        }
       .flex-image{
        width: 100%;

       } 
    </style>
</head>
<body>
    <ul class="flex-container">
        <li class="flex-item"><img src="images/flower.jpg" class="flex_image"></li>
        <li class="flex-item"><img src="images/flower.jpg" class="flex_image"></li>
        <li class="flex-item"><img src="images/flower.jpg" class="flex_image"></li>
        <li class="flex-item"><img src="images/flower.jpg" class="flex_image"></li>
        <li class="flex-item"><img src="images/flower.jpg" class="flex_image"></li>
       

    </ul>
</body>
</html>
