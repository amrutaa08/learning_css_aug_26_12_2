<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .t_shadow{
            text-shadow: 5px 6px 5px red;
            color: blue;
            font-size: 70px;
            text-align: center;
        }
        .b_shadow{
            width: 400px;
            box-shadow: 6px 7px 8px blue;
        }
        .b_shadow2{
            width: 400px;
            box-shadow: 9px 10px 20px red;
        }
        .d_shadow{
            width: 500px;
            filter: drop-shadow( 5px 6px 8px red);
        }
        .d_shadow2{
            width: 500px;
            filter: drop-shadow( 11px 13px black);
        }
    </style>
</head>
<body>
    <img src="images/cat.png" class="d_shadow"/>
    <img src="images/cat img.png" class="d_shadow2"/>
    <h1 class="t_shadow">Shweta</h1>
    <img src="images/pexels-pixabay-276267.jpg" alt="pixabay" class="b_shadow">
    <img src="images/pexels-pixabay-276267.jpg" alt="photo" class="b_shadow2">
</body>
</html>
