<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            height: 400px;
            background: linear-gradient(to right, red,orange,white,blue);
        }
        .bg_heading1{
            color: black;
            text-align: center;
            padding: 50px;
            font-size: 80px;
        }
        .radial{
            height: 600px;
            /* ellipse */
            background: radial-gradient(circle,black,red,white,blue);
        }
        .conic{
            height: 600px;
            background: conic-gradient(from 45deg,red, yellow, green, blue, black);
        }
    </style>
.</head>
<body>
    <div class="conic"></div>
    <div class="radial"></div>
    <div class="linear">
    <h1 class="bg_heading1">Hello Welcome</h1>
    </div>
</body>
</html>
