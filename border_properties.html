<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .b_property1{
            width: 200px;
            border: 30px solid black;
        }
        .b_property2{
            width: 200px;
            border: 5px dotted black;
        }
        .b_property3{
            width: 200px;
            border: 10px inset black;
        }
        .b_property4{
            width: 200px;
            border: 20px outset black;
        }
        .b_property5{
            width: 200px;
            border: 12px dashed black;
        }
        .b_property6{
            width: 200px;
            border: 10px groove black;
        }
        .b_property7{
            width: 180px;
            border:15px solid blue;
            border-top-color: black;
            border-right-color: brown;
            border-bottom-color: black;
            border-left-color: brown;
            border-radius: 40px 60px 70px 100px;
            /* border-radius: 50px; */
        }
    </style>
</head>
<body>
    <img src="images/flower.jpg" class="b_property1"/>
    <img src="images/flower.jpg" class="b_property2"/>
    <img src="images/flower.jpg" class="b_property3"/>
    <img src="images/flower.jpg" class="b_property4"/>
    <img src="images/flower.jpg" class="b_property5"/>
    <img src="images/flower.jpg" class="b_property6"/>
    <img src="images/flower.jpg" class="b_property7"/>




</body>
</html>
